<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mac Control{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🖥️</span>
                <span class="logo-text">Mac Control</span>
            </div>
            <div class="nav-links">
                <a href="/?token={{ token }}" class="nav-link">
                    <span class="nav-icon">🏠</span>
                    <span>Home</span>
                </a>
                <a href="/status/?token={{ token }}" class="nav-link">
                    <span class="nav-icon">📊</span>
                    <span>Status</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Mac Control Panel • Secure Remote Access</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
