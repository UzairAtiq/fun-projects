{% extends "base.html" %}

{% block title %}Error - Mac Control{% endblock %}

{% block content %}
<div class="container">
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1 class="error-title">Something went wrong</h1>
        <p class="error-message">{{ error }}</p>
        <a href="/?token={{ token }}" class="back-button">← Back to Home</a>
    </div>
</div>

<style>
    .error-container {
        text-align: center;
        padding: 60px 20px;
        max-width: 600px;
        margin: 0 auto;
    }

    .error-icon {
        font-size: 80px;
        margin-bottom: 20px;
    }

    .error-title {
        font-size: 32px;
        color: #ff4444;
        margin-bottom: 15px;
    }

    .error-message {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 30px;
        padding: 20px;
        background: rgba(255, 68, 68, 0.1);
        border-radius: 10px;
    }
</style>
{% endblock %}
